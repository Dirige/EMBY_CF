# Safe first-install MULTI placeholder, not an existing site's deployment config.
# Prefer a reviewed wrangler.local.multi.toml copied from wrangler.multi.example.toml.
# Personal edition: copy wrangler.personal.example.toml instead. Read DEPLOY.md.
name = "replace-with-your-multi-worker"
main = "dist/multi.mjs"
compatibility_date = "2026-10-17"
compatibility_flags = []
keep_vars = true
workers_dev = false

[placement]
mode = "smart"

[vars]
BASE_DOMAIN = "fd.example.com"
DNS_RECORD_NAME = "fd"
USER_DOMAIN = "example.com"
DISABLE_DIRECT_PROXY = "1"

[[d1_databases]]
binding = "DB"
database_name = "replace-with-multi-database"
database_id = "00000000-0000-0000-0000-000000000000"

# No automatic Cron, domain routes, account ID, or secret values.
# Configure them explicitly for a first install; retain them on an upgrade.
